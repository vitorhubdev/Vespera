# One decoder at a time. OpenH264 keeps process-global state, and a second
# WelsCreateDecoder access-violates on Windows. Nextest already runs each
# test in its own process; this group keeps the heavy video tests from
# stacking on the same runner.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 2 }

[profile.ci]
slow-timeout = { period = "30s", terminate-after = 2 }

[test-groups]
openh264 = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(video::) | test(scrub_commit_with_real_decoder) | test(scrub_lifecycle_with_real_decoder) | test(every_surface_lays_out)'
test-group = 'openh264'

# This test stretches several minutes of audio on purpose. The default
# 60 second cap kills it before it can finish.
[[profile.default.overrides]]
filter = 'test(overlap_add_continues_across_pushes_and_past_two_minutes)'
slow-timeout = { period = "60s", terminate-after = 6 }

[[profile.ci.overrides]]
filter = 'test(video::) | test(scrub_commit_with_real_decoder) | test(scrub_lifecycle_with_real_decoder) | test(every_surface_lays_out)'
test-group = 'openh264'

[[profile.ci.overrides]]
filter = 'test(overlap_add_continues_across_pushes_and_past_two_minutes)'
slow-timeout = { period = "60s", terminate-after = 6 }
