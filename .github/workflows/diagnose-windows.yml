# Temporary: name the lib test that dies with STATUS_ACCESS_VIOLATION on
# windows-latest. Delete this file once that test is fixed.
name: Diagnose Windows lib tests

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: diagnose-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: ffmpeg
        shell: bash
        run: choco install ffmpeg -y --no-progress
      - uses: Swatinem/rust-cache@v2
      - name: Compile lib tests once
        # Default pwsh, same as CI. Git Bash puts a Perl on PATH that cannot
        # configure the vendored OpenSSL (Locale::Maketext::Simple missing).
        shell: pwsh
        run: cargo test --locked --lib --no-run --message-format=json | Out-File -FilePath "$env:RUNNER_TEMP\compile.json" -Encoding utf8NoBOM
      - name: Single-thread JSON lib tests
        id: suite
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python - << 'PY'
          import json, os, pathlib
          exe = None
          for line in pathlib.Path(os.environ["RUNNER_TEMP"], "compile.json").read_text(encoding="utf-8", errors="replace").splitlines():
              line = line.strip()
              if not line.startswith("{"):
                  continue
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if event.get("reason") != "compiler-artifact":
                  continue
              path = event.get("executable")
              if path:
                  exe = path
          if not exe:
              raise SystemExit("no test executable in compile.json")
          pathlib.Path(os.environ["RUNNER_TEMP"], "test-exe.txt").write_text(exe, encoding="utf-8")
          print(exe)
          PY
          EXE=$(cat "$RUNNER_TEMP/test-exe.txt")
          # Stable libtest (1.98) rejects --format json. Capture stays on:
          # the isolated test passed only with --nocapture, and the suite
          # dies with capture. surface-trace.txt is appended outside stdio.
          # Isolated layout passes. The full suite dies on the video page.
          # These filters find which earlier tests leave the process in that state.
          run_one() {
            label="$1"
            shift
            rm -f "$RUNNER_TEMP/surface-trace.txt"
            "$EXE" "$@" --test-threads=1 > "$RUNNER_TEMP/tests-$label.txt" 2>&1
            code=$?
            echo "$code" > "$RUNNER_TEMP/exit-$label.txt"
            echo "exit-$label=$code"
            if [ -f "$RUNNER_TEMP/surface-trace.txt" ]; then
              cp "$RUNNER_TEMP/surface-trace.txt" "$RUNNER_TEMP/surface-$label.txt"
            fi
            return "$code"
          }
          # Earlier demo tests run in the same process, before every_surface.
          # Animation, drag and audio alone did not reproduce the fault.
          if run_one demo demo::tests; then
            run_one prior app:: archive:: backend:: badge:: bidi:: cache:: demo::tests::every_surface_lays_out || true
          fi
          exit 0
      - name: Name the culprit
        shell: bash
        run: |
          python - << 'PY'
          import os, pathlib, re, sys

          def culprit_of(path):
              file = pathlib.Path(path)
              if not file.exists():
                  return None, None, None
              last = None
              open_name = None
              for line in file.read_text(encoding="utf-8", errors="replace").splitlines():
                  match = re.search(r"test (\S+) \.\.\.\s*(.*)$", line)
                  if not match:
                      continue
                  name, rest = match.group(1), match.group(2).strip()
                  last = name
                  if rest == "ok" or rest.startswith("ok ") or rest == "FAILED" or rest.startswith("ignored"):
                      open_name = None
                  else:
                      open_name = name
              return open_name, last, file.read_text(encoding="utf-8", errors="replace")[-2000:]

          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          failed = False
          for label in ("demo", "prior"):
              trace = temp / f"surface-{label}.txt"
              if trace.exists():
                  lines = trace.read_text(encoding="utf-8", errors="replace").splitlines()
                  print(f"{label}: last_surface={lines[-1] if lines else 'EMPTY'} count={len(lines)}")
              else:
                  print(f"{label}: last_surface=MISSING")
              open_name, last, tail = culprit_of(temp / f"tests-{label}.txt")
              exit_file = temp / f"exit-{label}.txt"
              code = exit_file.read_text(encoding="utf-8").strip() if exit_file.exists() else "missing"
              print(f"{label}: exit={code} last_line={last} open={open_name}")
              if code not in ("0", "missing"):
                  failed = True
                  if tail:
                      print(f"----- {label} tail -----")
                      print(tail)
          sys.exit(1 if failed else 0)
          PY
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-lib-test-log
          path: |
            ${{ runner.temp }}/tests-*.txt
            ${{ runner.temp }}/surface-*.txt
          if-no-files-found: warn
