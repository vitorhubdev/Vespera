name: Packaging

on:
  push:
    branches: [main, master]
    paths: [native-packages.yaml, packaging/**, contrib/omarchy/**, .github/workflows/packaging.yml, .github/workflows/release.yml]
  pull_request:
    paths: [native-packages.yaml, packaging/**, contrib/omarchy/**, .github/workflows/packaging.yml, .github/workflows/release.yml]
  workflow_dispatch:
    inputs:
      version:
        description: Published version (empty validates packaging configuration only)
        type: string
        default: ''
      publish:
        description: Attach packages and run enabled downstream publishers
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      publish:
        type: boolean
        default: true
    secrets:
      AUR_SSH_KEY:
        required: false
      AUR_KNOWN_HOSTS:
        required: false
      HOMEBREW_TAP_GITHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  packaging:
    permissions:
      contents: write
    uses: crmne/native-packages/.github/workflows/package.yml@f002ce91c1180528734538fa47d235d387fd351f # v0.6.0
    with:
      targets: linux-amd64,linux-arm64
      version: ${{ inputs.version }}
      publish: ${{ inputs.publish == true && inputs.version != '' }}
    secrets: inherit

  installation:
    if: inputs.version != ''
    name: Install (${{ matrix.os }}, ${{ matrix.image }})
    needs: packaging
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        # Every image is pinned. `fedora:latest` broke the aarch64 run on
        # 2026-10-02: the image of the day served zchunk metadata the
        # container's libdnf5 could not validate, so the job failed on the
        # distro's own repository, not on Vespera.
        image: ['ubuntu:24.04', 'debian:13-slim', 'fedora:41', 'fedora:42']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: native-packages
          path: dist/native-packages
      - name: Install and check runtime libraries in a clean container
        env:
          IMAGE: ${{ matrix.image }}
        run: bash packaging/test-install.sh "$IMAGE" dist/native-packages
